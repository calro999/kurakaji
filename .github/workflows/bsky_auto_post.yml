name: Bluesky 5x Daily Auto Post & Auto-Engagement

on:
  schedule:
    # JST 0:00 (UTC 15:00)
    # JST 6:00 (UTC 21:00)
    # JST 12:00 (UTC 03:00)
    # JST 17:00 (UTC 08:00)
    # JST 19:00 (UTC 10:00)
    - cron: '0 15,21,3,8,10 * * *'
  workflow_dispatch:

concurrency:
  group: bluesky-kurakaji
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bluesky_post_and_engage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Bluesky Auto Poster & Community Engagement
        env:
          BSKY_HANDLE: "kurakaden.bsky.social"
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD || '4a7z-s25w-vqwm-biyh' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENABLE_JITTER: "1"
        run: |
          python scripts/bsky_auto_post.py

      - name: Commit and Push History & Caches
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/posted_bsky_articles.txt scripts/bsky_post_counter.json scripts/used_bsky_images.txt scripts/bsky_engagement_history.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: record bluesky post & engagement history [skip ci]"
            git pull --rebase origin main || true
            git push origin main || git push || true
          fi
