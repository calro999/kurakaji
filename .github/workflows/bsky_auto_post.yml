name: Bluesky Auto Post & Auto-Engagement

on:
  schedule:
    # 混雑する00分を避け、毎時17分・47分（30分おき）に定期ポーリング実行
    # スクリプト内のインターバルガード（2時間）により1日最大12回・安全投稿
    - cron: '17,47 * * * *'
  workflow_dispatch:

concurrency:
  group: bluesky-kurakaji
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bluesky_post_and_engage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests atproto Pillow

      - name: Run Bluesky Auto Poster & Community Engagement
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE || 'kurakaden.bsky.social' }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD || '4a7z-s25w-vqwm-biyh' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/bsky_poster.py

      - name: Commit and Push History & Caches
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/bluesky_post_history.txt scripts/bluesky_post_texts.jsonl scripts/bluesky_engagement_history.txt scripts/used_bsky_images.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: record bluesky post & engagement history [skip ci]"
            git pull --rebase origin main || true
            git push origin main || git push || true
          fi
